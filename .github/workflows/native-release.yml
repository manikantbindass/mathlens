name: Build application prerelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prerelease tag matching the package version
        required: true
        default: v0.2.0-alpha.1
        type: string
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Validate version
        env: {RELEASE_TAG: '${{ inputs.tag }}'}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]
          test "v$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")" = "$RELEASE_TAG"
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Package actual web runtime and explanation documents
        run: |
          mkdir -p release-assets
          test -s docs/MathLens-Project-Overview.pptx
          test -s docs/MathLens-Project-Overview.pdf
          tar -czf release-assets/MathLens-web-runtime.tar.gz -C dist .
          cp docs/MathLens-Project-Overview.* release-assets/
      - uses: actions/upload-artifact@v4
        with: {name: web-and-documents, path: release-assets/, if-no-files-found: error}
  desktop:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci
        working-directory: apps/desktop
      - name: Build Windows installer
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env: {CSC_IDENTITY_AUTO_DISCOVERY: 'false'}
        run: npm run package:win
      - name: Install and test Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath apps/desktop/dist -Filter '*windows-x64-unsigned.exe' | Select-Object -First 1
          if (!$installer) { throw 'Installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'MathLens-installed'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw 'Installer failed' }
          $env:MATHLENS_SMOKE_TEST = '1'
          $env:MATHLENS_SMOKE_REPORT = Join-Path $env:GITHUB_WORKSPACE 'windows-smoke.json'
          $client = Start-Process -FilePath (Join-Path $installDir 'MathLens.exe') -Wait -PassThru -WindowStyle Hidden
          if ($client.ExitCode -ne 0) { throw 'Installed application smoke test failed' }
          $proof = Get-Content -LiteralPath $env:MATHLENS_SMOKE_REPORT | ConvertFrom-Json
          if (!$proof.passed) { throw 'Missing successful smoke proof' }
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        env: {CSC_IDENTITY_AUTO_DISCOVERY: 'false'}
        run: npm run package:linux
      - name: Test Linux packaged application
        if: runner.os == 'Linux'
        run: |
          test -s apps/desktop/dist/*linux-x86_64.AppImage
          MATHLENS_SMOKE_TEST=1 MATHLENS_SMOKE_REPORT="$GITHUB_WORKSPACE/linux-smoke.json" xvfb-run -a apps/desktop/dist/linux-unpacked/mathlens --no-sandbox
          node -e "if(!JSON.parse(require('fs').readFileSync('linux-smoke.json')).passed) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*windows-x64-unsigned.exe
            apps/desktop/dist/*linux-x86_64.AppImage
            *-smoke.json
  android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build actual debug APK and instrumentation tests
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle -p apps/android --no-daemon :app:connectedDebugAndroidTest
      - name: Verify APK signing and manifest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apps/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging apps/android/app/build/outputs/apk/debug/app-debug.apk > android-manifest.txt
          grep "dev.mathlens.app.debug" android-manifest.txt
          mkdir -p android-assets
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk android-assets/MathLens-0.2.0-alpha.1-android-debug.apk
          cp android-manifest.txt android-assets/
      - uses: actions/upload-artifact@v4
        with: {name: android-debug, path: android-assets/, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: android-test-results, path: apps/android/app/build/reports/}
  publish:
    needs: [quality, desktop, android]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'desktop-*', path: release-assets/, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: android-debug, path: release-assets/}
      - uses: actions/download-artifact@v4
        with: {name: web-and-documents, path: release-assets/}
      - name: Require real artifacts and generate checksums
        run: |
          test -s release-assets/MathLens-0.2.0-alpha.1-windows-x64-unsigned.exe
          test -s release-assets/MathLens-0.2.0-alpha.1-linux-x86_64.AppImage
          test -s release-assets/MathLens-0.2.0-alpha.1-android-debug.apk
          cd release-assets
          sha256sum *.exe *.AppImage *.apk *.tar.gz *.pptx *.pdf > SHA256SUMS.txt
      - name: Publish experimental prerelease only after required jobs pass
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ inputs.tag }}'}
        run: gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --prerelease --title "MathLens $RELEASE_TAG - experimental online clients" --notes-file NATIVE_RELEASE_NOTES.md
