name: Publish Android 15+ prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  APK_NAME: MathLens-0.2.0-alpha.2-android15plus-debug.apk
  RELEASE_TAG: android-v0.2.0-alpha.2
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK, instrumentation tests, and lint
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle -p apps/android --no-daemon :app:connectedDebugAndroidTest
      - name: Verify actual APK metadata and signing
        run: |
          mkdir -p android-assets
          apk=apps/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" > android-assets/android-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > android-assets/android-manifest.txt
          grep "package: name='dev.mathlens.app.debug' versionCode='3' versionName='0.2.0-alpha.2'" android-assets/android-manifest.txt
          grep "sdkVersion:'35'" android-assets/android-manifest.txt
          grep "targetSdkVersion:'35'" android-assets/android-manifest.txt
          cp "$apk" "android-assets/$APK_NAME"
      - uses: actions/upload-artifact@v4
        if: matrix.api == 35
        with: {name: android15-package, path: android-assets/, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-${{ matrix.api }}-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/outputs/androidTest-results/
  publish:
    needs: android
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: android15-package, path: release-assets/}
      - name: Create checksum and publish tested APK
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          test -s "release-assets/$APK_NAME"
          (cd release-assets && sha256sum "$APK_NAME" > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --prerelease --title 'MathLens Android 15+ — 0.2.0-alpha.2' --notes-file ANDROID_RELEASE_NOTES.md
      - name: Verify public unauthenticated APK download
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_NAME"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 "$url" --output downloaded.apk
          cmp downloaded.apk "release-assets/$APK_NAME"
          sha256sum downloaded.apk
          echo "Public APK download verified: $url" >> "$GITHUB_STEP_SUMMARY"
